[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "eqlib"
description = "Tools for finding equilibrium"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Thomas Oberbichler", email = "thomas.oberbichler@gmail.com" },
]
requires-python = ">=3.12"
dependencies = ["numpy", "scipy"]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/oberbichler/EQlib"

[project.optional-dependencies]
tests = ["pytest", "hyperjet"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["include/eqlib/Info.h.in"]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-*"
skip = "*-musllinux*"
test-command = "python -c \"import eqlib; print(eqlib.__version__)\""
